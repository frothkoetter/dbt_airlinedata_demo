models:
  - name: traffic_cancel_airlines
    config:
      contract:
        enforced: true
    columns:
      - name: airline_code
        data_type: string
        constraints:
            - type: not_null

      - name: airline_name
        data_type: string
        constraints:
            - type: not_null

      - name: year
        data_type: int
        constraints:
            - type: not_null
            - type: check
              expression: "year >= {{ min_value }} and year <= {{ max_value }}"
              config:
                    min_value: 1995
                    max_value: 2023

      - name: month
        data_type: int
        constraints:
              - type: not_null
              - type: check
                expression: "year >= {{ min_value }} and year <= {{ max_value }}"
                config:
                    min_value: 1995
                    max_value: 2023

      - name: flights_count
        data_type: int
        constraints:
              - type: not_null

      - name: cancelled
        data_type: int
        constraints:
              - type: not_null

      - name: departure_delay_minutes
        data_type: int
        constraints:
              - type: not_null

      - name: departure_delay_count
        data_type: int
        constraints:
              - type: not_null


  - name: airport_departing_airlines_pivot
    columns:
      - name: total_departures
        tests:
          # Check that the value is within a reasonable range
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 5000
          # Ensure the column type is actually numeric (vital for Parquet)
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number

      - name: airport_code
        tests:
          # Ensure the code always matches the IATA 3-letter format
          - dbt_expectations.expect_column_value_lengths_to_equal:
             value: 3
